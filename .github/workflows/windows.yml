name: "Windows builds"
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# a new push makes the builds of older commits of the same branch obsolete
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - i686
          - x86_64
        # Qt 6: Windows 10/11, Qt 5: legacy build for Windows 7/8.1
        qt:
          - 6
          - 5
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf -y install git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: .ci/windows/fedora-deps.sh ${{ matrix.arch }} ${{ matrix.qt }}
      - run: .ci/windows/build-fedora.sh ${{ matrix.arch }} ${{ matrix.qt }}
      - uses: actions/upload-artifact@v4
        with:
          name: tafat-windows-${{ matrix.arch }}-qt${{ matrix.qt }}
          path: "*-setup.exe"

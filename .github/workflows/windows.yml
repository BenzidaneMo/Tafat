name: "Windows builds"
on:
  push:
    branches:
      - '**'
    # a version tag (e.g. v0.1.0-beta1) also publishes the installers as a GitHub release
    tags:
      - 'v*'
  workflow_dispatch:

# a new push makes the builds of older commits of the same branch obsolete
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - i686
          - x86_64
        # Qt 6: Windows 10/11, Qt 5: legacy build for Windows 7/8.1
        qt:
          - 6
          - 5
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf -y install git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: .ci/windows/fedora-deps.sh ${{ matrix.arch }} ${{ matrix.qt }}
      - run: .ci/windows/build-fedora.sh ${{ matrix.arch }} ${{ matrix.qt }}
      - uses: actions/upload-artifact@v4
        with:
          name: tafat-windows-${{ matrix.arch }}-qt${{ matrix.qt }}
          path: "*-setup.exe"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tafat-windows-*
          merge-multiple: true
      - run: ls -l *-setup.exe
      # pre-release until the installers have been tested on real lab PCs
      - uses: softprops/action-gh-release@v2
        with:
          files: "*-setup.exe"
          prerelease: true
          generate_release_notes: true
          body: |
            Windows installers (see docs/install.html or docs/DEPLOYMENT.md):

            | Windows | Installer |
            |---|---|
            | 10 / 11, 64-bit | `*-win64-setup.exe` |
            | 10, 32-bit | `*-win32-setup.exe` |
            | 7 / 8.1, 64-bit | `*-win64-legacy-setup.exe` |
            | 7 / 8.1, 32-bit | `*-win32-legacy-setup.exe` |

            Not tested on real lab computers yet.

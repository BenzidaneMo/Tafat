name: "Windows dependency probe"
# Temporary: lists which MinGW packages the candidate build environments
# provide for the 32-bit and 64-bit Windows builds. Run manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-deps-probe.yml

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: |
          for arch in mingw32 mingw64; do
            for p in gcc-c++ qt6-qtbase qt6-qt5compat qt6-qttools qt6-qttranslations qt6-qtwebsockets qt6-qthttpserver \
                     qt5-qtbase qt5-qttools qt5-qttranslations qt5-qtwebsockets \
                     qca-qt6 qca-qt5 openssl openldap cyrus-sasl lzo libjpeg-turbo libpng zlib libvncserver nsis; do
              if dnf -q list --available "$arch-$p" >/dev/null 2>&1; then echo "FOUND   $arch-$p"; else echo "MISSING $arch-$p"; fi
            done
          done
          dnf -q list --available 'mingw*-nsis' 'nsis' 2>/dev/null | tail -n +1 || true

  msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - run: |
          for prefix in mingw-w64-i686 mingw-w64-x86_64; do
            for p in qt6-base qt6-5compat qt6-tools qt6-translations qt6-websockets qt6-httpserver \
                     qt5-base qt5-tools qt5-translations qt5-websockets \
                     qca-qt6 qca-qt5 openssl openldap cyrus-sasl lzo2 libjpeg-turbo libpng zlib libvncserver nsis; do
              if pacman -Si "$prefix-$p" >/dev/null 2>&1; then echo "FOUND   $prefix-$p"; else echo "MISSING $prefix-$p"; fi
            done
          done

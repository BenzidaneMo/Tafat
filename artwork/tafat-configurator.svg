<?xml version="1.0" encoding="UTF-8"?>
<!-- Tafat Configurator icon (48 px and larger): the Tafat logo on a cream tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="6" y="6" width="244" height="244" rx="52" fill="#faf4ea" stroke="#13705f" stroke-width="8"/>
  <g transform="translate(26 22) scale(0.4)">
  <defs>
    <linearGradient id="light-logo" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="352">
      <stop offset="0" stop-color="#f6bf3f"/>
      <stop offset="1" stop-color="#f26b2d"/>
    </linearGradient>
  </defs>

  <!-- rays above the T -->
  <g stroke="#f6bf3f" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="104" x2="256" y2="58"/>
    <line x1="190" y1="112" x2="166" y2="74"/>
    <line x1="322" y1="112" x2="346" y2="74"/>
  </g>

  <!-- rays falling on the side laptops -->
  <g stroke="#f6bf3f" stroke-width="16" stroke-linecap="round">
    <line x1="176" y1="214" x2="138" y2="262"/>
    <line x1="124" y1="200" x2="72" y2="242"/>
    <line x1="336" y1="214" x2="374" y2="262"/>
    <line x1="388" y1="200" x2="440" y2="242"/>
  </g>

  <!-- the T -->
  <rect x="120" y="128" width="272" height="60" rx="30" fill="url(#light-logo)"/>
  <rect x="226" y="150" width="60" height="202" rx="30" fill="url(#light-logo)"/>

  <!-- laptops -->
  <g fill="#dff2ea" stroke="#13705f" stroke-width="16" stroke-linejoin="round">
    <rect x="44" y="288" width="120" height="80" rx="10"/>
    <rect x="348" y="288" width="120" height="80" rx="10"/>
    <rect x="196" y="378" width="120" height="80" rx="10"/>
  </g>
  <g fill="#13705f">
    <rect x="26" y="378" width="156" height="18" rx="9"/>
    <rect x="330" y="378" width="156" height="18" rx="9"/>
    <rect x="178" y="468" width="156" height="18" rx="9"/>
  </g>

  </g>
  <!-- settings badge -->
  <g transform="translate(206 206) scale(0.7)">
    <circle r="54" fill="#fffdf9" stroke="#13705f" stroke-width="8"/>
    <g fill="#13705f">
      <circle r="26"/>
      <rect x="-9" y="-40" width="18" height="80" rx="4"/>
      <rect x="-9" y="-40" width="18" height="80" rx="4" transform="rotate(45)"/>
      <rect x="-9" y="-40" width="18" height="80" rx="4" transform="rotate(90)"/>
      <rect x="-9" y="-40" width="18" height="80" rx="4" transform="rotate(135)"/>
    </g>
    <circle r="11" fill="#fffdf9"/>
  </g>

</svg>
